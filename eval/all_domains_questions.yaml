      I m following up my original post about being tricked with moissanite when I paid for a diamond eternity band. [You can see the original post here](https:  www.reddit.com r Diamonds comments f4ydou tricked_with_moissanite_instead_of_a_diamond ) (tl dr ed below). I m in California and the seller is in Virginia.   ***TL DR of Original*** *- A jeweler based in Virginia was referred to me by a close friend who s been buying from him for years. He sells me an eternity band wedding ring for my partner that turn out to be  after two independent appraisals (including a test with GIA Gem ID100)  the stones are moissanite  not diamond. The ring is worth a fraction of what I paid and I got the appraisals within 24hrs of getting the ring. I immediately put the charges to my CC on hold. The seller is a Graduate Gemologist (GG) from the Gemological Institute of America (GIA). After posting  I decide to try to work with him for a replacement ring.*  And that s how we get here. I figure it s a good idea to give the seller the option to send me the ring I paid for because of his close relationship with my close friends and to show I did everything I could just in case. The deal I sent him and that we talked about on the phone was the following:  1. Seller will send me a replacement ring to original spec by 2 28 because that s how long my CC will hold charges. I tell him that if he sends later than that  the chargeback will go through. 2. Seller will pay me for the appraisals. 3. I will verify that the replacement ring is real before sending him back the original moissanite ring.  4. If this doesn t happen  it s a much more serious problem and that I would go to the police.  He will confirm this over the phone  but will not reply to my texts. This worries me and I keep trying to confirm with him. Finally  he texts me back.  The ring will be ready next week (past when the bank can hold my charges before they go to *his* bank) and then he says something really weird... He says that my friend will verify the ring before it s sent to me. He says   We both expect you to return the original to her within that time frame.  Uhhh what? We never talked about this. I immediately call my friend who clarified that she would verify he sent it  but can t verify anything about real diamonds. She says she doesn t want to be in the middle and the seller is probably trying to rebuild her trust. I tell her I don t want anyone else involved and that it s sketchy he said that. She emphatically agrees (and I trust her).  I tell the seller that the new timing is okay since we can fix the chargeback  but that my friend doesn t need to (and shouldn t) verify anything. I tell him the only verifications I need are the shipping id and my two independent appraisals. Then the seller fucks up. He says...  &gt I thought \[my friend\] talked to him ....here is the thread today with him  He still wants a second ring while holding the first and he has scheduled a chargeback !   I sent this to \[my friend\] too    Oops. Sent it to the wrong person. So now I think he s using everything I m saying to build up advocates on his side. It also looks like he s trying to position me as stealing from him by keeping the ring and doing the chargeback (reminder: the charges are on hold while him and I sort through this). This immediately makes me nervous. I clarify with him again that the charges are just on hold and that I will not send back the original ring until I verify the replacement is real.  Then he gets weird. He says my verifiers are no better than his  that he trusts my friend  that he should protect himself with a witness  and that I brought my friend into this whole mess in the first place by telling her anything.  I calmly remind him that my verifiers are independent jewelers because I don t trust him  that my friend isn t GG GIA  and that I won t send him the original ring until I get the real ring. Personally  I think he wants the evidence back... I tell him that the other option is that I stop dealing with him and go straight to the police. I tell him it s his choice.  \---  But here s the thing... I m done. I m not dealing with this dude anymore. I know a lot of you will say I should have immediately reported this  but I believe in letting people fix their problems. This guy is clearly not trying to fix the problem though and he keeps getting sketchier and sketchier.  What are my next steps? How do I report something like this? To his state s police? Mine? The FBI?   Thanks Reddit :)
